name: Release

# Independent per-integration releases (spec §4.2).
# Tag grammar: <id>-v<semver>, e.g. hermes-v0.2.1 or hermes-v0.3.0-rc.1.
# A release never trusts a previous CI run: it re-runs the integration's full
# checks across its full declared matrix before publishing anything.

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identify:
    name: identify and validate the tag
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.parse.outputs.id }}
      version: ${{ steps.parse.outputs.version }}
      dir: ${{ steps.parse.outputs.dir }}
      os: ${{ steps.parse.outputs.os }}
      language: ${{ steps.parse.outputs.language }}
      interpreter: ${{ steps.parse.outputs.interpreter }}
      test: ${{ steps.parse.outputs.test }}
      lint: ${{ steps.parse.outputs.lint }}
      shell: ${{ steps.parse.outputs.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - run: pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - id: parse
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "tools")
          import ct_ci_manifest, ct_ci_package
          tag = os.environ["GITHUB_REF_NAME"]
          try:
              ident, version = ct_ci_package.parse_tag(tag)
              directory, data = ct_ci_package._manifest(".", ident)
              if str(data["version"]) != version:
                  raise SystemExit(
                      f"tag {tag} does not match {directory}/integration.yaml "
                      f"version {data['version']}"
                  )
              # Fails loudly here, before anything is published, if notes are
              # missing or empty.
              ct_ci_package.changelog_section(directory, version)
          except ValueError as error:
              raise SystemExit(str(error))
          if data.get("status") != "implemented":
              raise SystemExit(f"{ident} is status={data.get('status')}; nothing to release")
          matrix = data["matrix"]
          checks = data["checks"]
          # The interpreter axis is language-specific (ct_ci_manifest enforces
          # exactly one of matrix.python / matrix.node per language). Collapse
          # it into one `interpreter` output so `verify` stays language-
          # agnostic: keying the matrix off matrix.python alone gave a node
          # integration a zero-length axis, and a zero-length axis generates no
          # jobs at all — the release would verify nothing and still publish.
          language = data.get("language", "python")
          interpreter = matrix.get("node" if language == "node" else "python", [])
          if not interpreter:
              raise SystemExit(
                  f"{ident}: matrix declares no {language} interpreter versions; "
                  "refusing to release without a verification matrix"
              )
          print(f"id={ident}")
          print(f"version={version}")
          print(f"dir={directory.as_posix()}")
          print(f"language={language}")
          print("os=" + json.dumps(matrix["os"]))
          print("interpreter=" + json.dumps(interpreter))
          print("test=" + checks["test"])
          print("lint=" + checks.get("lint", ""))
          print("shell=" + json.dumps(checks.get("shell", [])))
          PY

      - name: Policy gates must pass at the tagged commit
        run: python tools/ct_ci.py policy

  verify:
    name: ${{ needs.identify.outputs.id }} (${{ matrix.os }}, ${{ needs.identify.outputs.language }} ${{ matrix.interpreter }})
    needs: identify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJson(needs.identify.outputs.os) }}
        interpreter: ${{ fromJson(needs.identify.outputs.interpreter) }}
    defaults:
      run:
        working-directory: ${{ needs.identify.outputs.dir }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        if: needs.identify.outputs.language == 'python'
        with:
          python-version: ${{ matrix.interpreter }}

      # Node integrations need their toolchain before the declared checks run:
      # `checks.test` compiles first (lib/ is gitignored, so a checkout has
      # nothing to test against). Same pinned actions as ci.yml.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # The pnpm version comes from the integration's `packageManager`
        # field, so the installer can never drift from the lockfile's writer.
        if: needs.identify.outputs.language == 'node'
        with:
          package_json_file: ${{ needs.identify.outputs.dir }}/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.identify.outputs.language == 'node'
        with:
          node-version: ${{ matrix.interpreter }}
          cache: pnpm
          cache-dependency-path: ${{ needs.identify.outputs.dir }}/pnpm-lock.yaml

      - name: Install dependencies
        # Frozen: a release must fail on a package.json that disagrees with the
        # committed lockfile, not paper over the drift.
        if: needs.identify.outputs.language == 'node'
        env:
          # pnpm bundles node-gyp 10, whose Visual Studio finder cannot
          # recognise VS 18 (2026) on the windows-latest image. Point it at
          # the integration's own node-gyp (>= 12.1.0, which knows VS 18)
          # for native-module builds like better-sqlite3.
          npm_config_node_gyp: ${{ github.workspace }}/${{ needs.identify.outputs.dir }}/node_modules/node-gyp/bin/node-gyp.js
        run: pnpm install --frozen-lockfile

      - run: ${{ needs.identify.outputs.test }}

      # Spec §4.2 step 3: the tag re-runs the integration's *full* declared
      # checks, not just its tests. Lint commands and shell scripts come
      # straight from the manifest, same as the test command above.

      - name: Install ruff
        # Only when the manifest declares a lint command (ruff is not
        # preinstalled on runners). Node integrations lint through their own
        # installed devDependencies, so they need nothing extra here.
        if: needs.identify.outputs.lint != '' && needs.identify.outputs.language == 'python'
        run: pip install --disable-pip-version-check ruff

      - name: Lint
        if: needs.identify.outputs.lint != ''
        run: ${{ needs.identify.outputs.lint }}

      - name: Shellcheck declared scripts
        # Declared shell checks re-run here on ubuntu only: shellcheck is a
        # one-line apt install there but awkward on the windows/macos runners.
        # The ci.yml policy job is the cross-OS authority for shell checks.
        if: matrix.os == 'ubuntu-latest' && needs.identify.outputs.shell != '[]'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          for script in $(echo '${{ needs.identify.outputs.shell }}' | python -c "import json,sys; print(*json.load(sys.stdin))"); do
            shellcheck "$script"
          done

  publish:
    name: publish the release
    needs: [identify, verify]
    runs-on: ubuntu-latest
    permissions:
      # The only job in the repository that may write. Everything upstream of
      # here runs with contents: read.
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - run: pip install --disable-pip-version-check -r tools/requirements-ci.txt

      # A node integration's declared entry points live in lib/, which is
      # gitignored — this checkout has no lib/ at all. `ct_ci.py package`
      # archives the working tree, so without a build here the tarball omits
      # them *silently* and ships a package whose `main` does not exist.
      # (ci.yml never caught this: there the packaging smoke test runs after
      # `checks.test`, which builds as its first step.)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: needs.identify.outputs.language == 'node'
        with:
          package_json_file: ${{ needs.identify.outputs.dir }}/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.identify.outputs.language == 'node'
        with:
          # The lowest interpreter the manifest declares: the artifact is built
          # against the integration's stated minimum, not the newest runner.
          node-version: ${{ fromJson(needs.identify.outputs.interpreter)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ needs.identify.outputs.dir }}/pnpm-lock.yaml

      - name: Build the shipped artifacts
        if: needs.identify.outputs.language == 'node'
        working-directory: ${{ needs.identify.outputs.dir }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build the artifact and release notes
        run: python tools/ct_ci.py package --tag "${GITHUB_REF_NAME}" --out dist

      - name: The archive must carry the declared entry point
        # Cheap standing guard against the silent-omission failure above:
        # assert the tarball really contains what package.json points `main`
        # at, rather than trusting that a build ran.
        if: needs.identify.outputs.language == 'node'
        env:
          # Passed through the environment, not interpolated into the script.
          INTEGRATION_DIR: ${{ needs.identify.outputs.dir }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys, tarfile
          directory = pathlib.Path(os.environ["INTEGRATION_DIR"])
          main = json.loads((directory / "package.json").read_text())["main"]
          archive = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive) as tar:
              names = tar.getnames()
          if not any(name == main or name.endswith("/" + main) for name in names):
              sys.exit(f"{archive.name} is missing the declared entry point {main}")
          print(f"{archive.name} carries {main}")
          PY

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: ${{ needs.identify.outputs.id }} v${{ needs.identify.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(needs.identify.outputs.version, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
