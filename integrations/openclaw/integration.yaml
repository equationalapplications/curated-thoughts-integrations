# CI contract for the OpenClaw integration (native OpenClaw plugin, host pin
# openclaw@2026.10.3 — tests/host/compatibility.json).
id: openclaw
name: Curated Thoughts for OpenClaw
version: 0.1.1
language: node
status: implemented
requires_sidecar: ">=2.5"
compat_tier: v2.5-full
version_mirror: package.json#version

matrix:
  # OpenClaw's engine floor is Node 24.16 (node >=24.16 <25 || >=26.1), so
  # 24.x is the only line both the host and our runners share. Sidecar and
  # PATHEXT discovery are where cross-OS support breaks, so all three OSes.
  os: [ubuntu-latest, macos-latest, windows-latest]
  node: ["24.x"]

checks:
  # Build first: lib/ is gitignored and the host shape contract
  # (tests/host/contract.test.ts) loads the BUILT entry, exactly as OpenClaw
  # loads it from package.json#openclaw.extensions.
  test: pnpm run build && pnpm run test
  lint: pnpm exec tsc --noEmit
  shell:
    - scripts/install.sh

policy:
  allow_sqlite_readonly:
    - scripts/ct_preflight.ts

package:
  include: ["**"]
  # lib/ must ship: openclaw.extensions and the doctor entry live there.
  exclude:
    - "**/dist/**"
    - "**/node_modules/**"
