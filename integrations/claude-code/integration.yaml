# CI contract for the Claude Code integration.
#
# This is the *CI* manifest. .claude-plugin/plugin.json remains the manifest
# Claude Code itself reads; `version_mirror` below is what keeps the two from
# drifting.
# Spec: docs/superpowers/specs/2026-09-11-claude-code-integration-design.md
#
# `status: planned` is deliberate while the scaffold lands: schema-validated,
# but skipped for tests, packaging and release until the shipped scripts exist.
# Task 2 flips it to `implemented`.
id: claude-code
name: Curated Thoughts for Claude Code
version: 0.1.0
language: python
status: planned
requires_sidecar: ">=2.5"
compat_tier: v2.5-full
version_mirror: .claude-plugin/plugin.json#version

matrix:
  # Sidecar discovery and path handling are exactly where cross-platform
  # claims break — and the real Windows sidecar path contains a space — so
  # Windows is not optional.
  os: [ubuntu-latest, macos-latest, windows-latest]
  # The code is stdlib-only, so the interpreter range is the whole
  # compatibility surface: oldest supported and current.
  python: ["3.9", "3.13"]

checks:
  test: python -m unittest discover -s tests
  lint: ruff check --select E9,F63,F7,F82,F401 .
  shell:
    - scripts/install.sh

policy:
  # ct_preflight.py is the import pre-flight census. It opens brain.db through
  # a mode=ro URI and issues nothing but SELECT — read-only by construction.
  # The architecture lint asserts exactly that for every file listed here.
  allow_sqlite_readonly:
    - scripts/ct_preflight.py

package:
  include: ["**"]
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"
