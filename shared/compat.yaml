# Shared compatibility matrix
# Single source of truth for sidecar capability tiers and engine data-safety.
# Integrations read this data; it is documentation-as-data, not code.

compat:
  # Sidecar tiers decide what the agent CAN DO. Verified against
  # curated-thoughts src-tauri/src/mcp_server.rs: v2.4.x registers 8 tools,
  # v2.5.x registers 14.
  #
  # Note the tier is detected from the live tool count, not from a version
  # string: the sidecar exposes no --version flag, and MCP serverInfo reports
  # the rmcp framework version rather than the Curated Thoughts release.
  tiers:
    v2.4-read:
      sidecar: ">=2.4,<2.5"
      tools: 8
      write_path: dormant
      notes: >-
        Read-only MCP surface. 8 tools (wiki_context, wiki_search,
        wiki_traverse_graph, wiki_get_ontology, vault_semantic_search,
        vault_related_chunks, vault_write_note, vault_upsert_index_entry).
    v2.5-full:
      sidecar: ">=2.5"
      tools: 14
      write_path: full
      notes: >-
        Adds curated_recall_context, curated_get_wiki_entry,
        curated_search_code, curated_add_wisdom, curated_update_wisdom and
        curated_archive_wisdom. Write-tool rules active.

  # Engine versions decide whether the DATA SURVIVES. core-llm-wiki is the JS
  # engine the desktop app runs; it shares brain.db with the sidecar, and its
  # setup() pass rewrites source_ref values. This is independent of the
  # sidecar tier: a fully capable sidecar and a mangling engine can coexist,
  # which is exactly the case the import pre-flight exists to catch.
  #
  # See curated-thoughts issue #186 and PR #188.
  engine:
    package: "@equationalapplications/core-llm-wiki"
    states:
      mangles-structured-refs:
        engine: "<=7.1.0"
        safe: false
        pinned_version: "7.1.0"
        notes: >-
          setup() runs an unconditional legacy-ref back-rewrite.
          findRowsForSourceRefMigration() selects a row if ANY of five
          predicates holds — TRIM(source_ref) != source_ref, INSTR '/',
          INSTR '\', INSTR CHAR(0), or GLOB '*[^-A-Za-z0-9._ ]*' — and strips
          it through normalizeSourceRef (drop disallowed chars, trim, slice to
          255). Every JSON blob qualifies. Note the GLOB alone is not the
          selector: space is inside the keep-set, so a whitespace-padded ref
          clears the GLOB and is still caught by TRIM. Fires on every app
          launch and every outbox-worker transition over the shared brain.db.
          The current pin, 7.1.0, still mangles (PR #188 §3, §7.2 — the
          earlier 6.0.1-vs-7.1.0 skew was resolved by #183). No fixed engine
          release exists yet; the upstream guard is a non-blocking follow-up
          (PR #188 §7.1).
    # A brain is engine-proof when Curated Thoughts writes normalizer-idempotent
    # tokens and keeps evidence in its own table, regardless of engine version.
    data_safety:
      engine_proof_from: "curated-thoughts >= 2.6 (PR #188 structural fix, unreleased)"
      # Normative shape (PR #188 §2.2): exactly the first 32 lowercase hex
      # characters of SHA-256(entry_id). §2.5.1's census keys on this regex.
      source_ref_shape: "^librarian-[0-9a-f]{32}$"
      evidence_table: librarian_evidence
      migration_step: V18
      # §2.4 Phase 1 writes unanchored facts deliberately so the drop rate can
      # be measured before the policy flips to skip+log. unanchored=1 rows are
      # expected, not damage.
      unanchored_column: true
      notes: >-
        Post-fix, source_ref is a per-entry hash token that normalizeSourceRef
        maps to itself, so none of the engine's five selector predicates
        matches it, and the evidence
        JSON lives in the CT-owned librarian_evidence table the engine never
        touches. Because the token is derived from the entry id it is stable
        across export and import.

  # Export/import: what must travel for a brain to keep working elsewhere.
  portability:
    required_tables:
      - llm_wiki_entries
      - librarian_evidence
      - chunks
      - documents
      - curated_proposals
      - curated_proposal_items
    machine_specific:
      - "config.json vault_path — absolute, and always wrong after an import"
    notes: >-
      PR #188 §2.5.5 defines a supported export as brain-complete: entries,
      evidence, chunks and proposals together. An export carrying
      llm_wiki_entries without librarian_evidence loses all provenance
      silently. An export without chunks was worse — entries with no surviving
      anchor look exactly like the orphan class §2.5.4 deletes — so the repair
      migration now asserts a complete chunk schema before any orphan
      deletion, requiring non-emptiness only for chunks and documents
      (embeddings are legitimately empty before the first embed sweep). If the
      assertion fails, orphan deletion is skipped and reported loudly.
      Re-point vault_path on the destination machine.
